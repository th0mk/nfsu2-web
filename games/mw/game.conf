# Need for Speed Most Wanted (2005, PC Black Edition v1.3): what the lift
# pipeline needs to know about the game, sourced by the tools (KEY=VALUE,
# shell syntax).  Addresses and hashes only: nothing made from the game goes
# in the repo.

EXE_NAME=speed.exe
EXE_SHA256=80774c2e5d619b4f120b48d4462896fd504c263399d203a238769cffde1d253c
# the CRT's _ftol2 (same code as UG2's), inlined at its call sites with FTOL2INL=1
FTOL2_VA=0x007C4B80
# a lock prefix on a read-modify-write of memory is lifted as the plain
# instruction (tools/lift.py): the PATH audio library's `lock xadd`s
LOCKSTRIP=1
# fnstenv/fldenv and fnsave/frstor are lifted (tools/lift.py): the CRT's x87
# pow saves the FPU with fnsave/frstor around its special-value helper
X87ENV=1
# server.dll (EA's LAN server, next to the exe): lift base, after the TEBs and
# before the d3dx DLL (0x00D00000-0x00D6F000), and SHA-256
SRV_BASE=0x00D00000
SRV_SHA256=c4fdd0e9e779be7f4be7728b03339eda4fd27248ceb9d2c640403b8fc90587ff
# d3dx9_26.dll (Microsoft DirectX redist, June 2005), lifted for dev oracle
# builds only, never shipped (gen.sh D3DX_DLL=<the file>): base
# (0x00D80000-0x00FCA000) and SHA-256
D3DX_BASE=0x00D80000
D3DX_SHA256=8ea96fe01c3c86a36fcb3795ae03eb12034003e335ef475571efaeda17c5bc78
# and the code in its .text (RVAs, tools/lift.py CODE_RVA): the linker merged
# the read-only data into .text, the IAT, constants, vtables and the SafeSEH
# table before 0x2A000 (zeros from 0x29890; the first function is at
# 0x2A005), the C++ EH tables from 0x202744 (right after the last function's
# ret), then the import and export tables
D3DX_CODE=0x0002A000-0x00202744
# and its functions compiled without optimisation (tools/genall.py OPTNONE):
# 0x00DFC7CB, 2,568 blocks (3.1 MB of C), was not compiled after 10 minutes
# at -O3 (in CorrelatedValuePropagation at 6, in the backend at 10); with it
# unoptimised its shard compiles in 11 s
D3DX_OPTNONE=0x00DFC7CB
# gen/mw/{all,server,d3dx}; out/mw/; out/web/mw/nfsmw.{wasm,json}
GEN_DIR=gen/mw
OUT_DIR=out/mw
WASM_NAME=nfsmw
FTOL2INL=1
# no addresses until MW has been profiled
INLINE_LIST=games/mw/inline_hot.txt
# callees that can return past their caller (tools/lift.py)
RETPAST_LIST=games/mw/retpast.txt
