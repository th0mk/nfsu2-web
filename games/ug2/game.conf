# Need for Speed Underground 2 (PC, v1.2 NA): what the lift pipeline needs to
# know about the game, sourced by the tools (KEY=VALUE, shell syntax).
# Addresses and hashes only: nothing made from the game goes in the repo.
# These are the values the tools use today; UG2 is the default game.

EXE_NAME=SPEED2.EXE
EXE_SHA256=f9dd86c054878ce6276beb07c1fd61874f7a1e4bf1f241b084c65b73e24168a7
# the CRT's _ftol2, inlined at its call sites with FTOL2INL=1 (tools/lift.py)
FTOL2_VA=0x0075BED4
# lock-prefixed instructions stay traps (tools/lift.py): UG2's 4 `lock or`
# sites are data decoded as code
LOCKSTRIP=0
# server.dll (EA's LAN server, next to the exe): lift base and SHA-256 (gen.sh, runtime/module.c)
SRV_BASE=0x00A00000
SRV_SHA256=a5f50324adeabedca748449965e5e0f409b0cfce065cd0ffb7975d06d55ba9e4
# no lifted d3dx9 DLL (the runtime's D3DX HLE only)
D3DX_BASE=
# gen/all and gen/server; out/ (relocs, flag table, logs); out/web/nfsu2.{wasm,json}
GEN_DIR=gen
OUT_DIR=out
WASM_NAME=nfsu2
# web/gen.sh's defaults: _ftol2 inlined, the hot callees of a race profile inlined
FTOL2INL=1
INLINE_LIST=tools/inline_hot.txt
# callees that can return past their caller (tools/lift.py)
RETPAST_LIST=tools/retpast.txt
