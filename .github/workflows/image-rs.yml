# The server's container image (web/server-rs/Dockerfile) -> ghcr.io/<owner>/<repo>-rs, for amd64 and arm64, tagged
# latest (the default branch), <version> and <major>.<minor> (a v* tag), sha-<commit> (every push).  Pull requests
# build it without pushing.  (ghcr.io/<owner>/<repo>, without -rs, was the Node server's image: its tags up to
# 6076514 stay in the registry.)  The image never holds the game or the game module: the build sees only the page's
# and the server's sources (web/server-rs/Dockerfile.dockerignore).
name: image-rs
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['web/server-rs/**', 'web/src/**', web/build.mjs, web/index.html,
      web/package.json, web/package-lock.json, app/registry-defaults.txt, CHANGELOG.md, .github/workflows/image-rs.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image-rs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # the page and the binary are built on the runner's platform (the binary cross-compiled), the image's own
      # stage only copies and adds a user: no QEMU
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-rs
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/server-rs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image-rs
          cache-to: type=gha,mode=max,scope=image-rs
