# compose.yml with a Cloudflare Tunnel in front instead of Caddy (docs/web/VPS.md, "Cloudflare"): cloudflared
# connects out to Cloudflare, so the VPS needs no open port for the game at all.  cloudflared and the server
# share one network namespace (a Docker network, not the VPS's): cloudflared reaches the server there, nothing
# else can, and the client's address comes from Cloudflare's CF-Connecting-IP.  In Cloudflare's dashboard the
# tunnel's public hostname is NFSU2_HOST and its service http://127.0.0.1:8080 (the dashboard refuses the
# server's socket, unix:@nfsu2-http, that a tunnel with a config file of its own could take).
#
# In .env, besides NFSU2_HOST, NFSU2_DATA and NFSU2_MODULE (compose.yml):
#   TUNNEL_TOKEN=<the tunnel's token>
#   COMPOSE_FILE=compose.yml:compose.tunnel.yml     so that plain "docker compose ..." uses both files
# then:  docker compose up -d && docker compose logs -f server
services:
  caddy:
    profiles: [off]          # not started: cloudflared is the front
  # holds the namespace, so that cloudflared and the server can each restart on their own (with the server in
  # cloudflared's own namespace, a restarted cloudflared got a new one and reached nothing until the server
  # was restarted too)
  net:
    image: registry.k8s.io/pause:3.10
    restart: unless-stopped
    cgroup_parent: ${NFSU2_SLICE:-nfsu2.slice}
    # the receive buffers of this namespace's sockets at most 128 KiB, not Linux's 32 MiB: what a player's path does
    # not take then waits at the server, which leaves out free roam's snapshots for it, instead of unread at
    # cloudflared, out of the server's sight (nfsu2.xyz, 2026-10-22: 132 MB there, up to 1 MB for one player).  The
    # localhost hop is fast enough with that for anything (a download goes on as fast as cloudflared reads).
    sysctls:
      net.ipv4.tcp_rmem: "4096 65536 131072"
  # four copies of the tunnel, 4 connections to Cloudflare each: a connection to a far or lossy Cloudflare site
  # slows every player on it (nfsu2.xyz, 2026-10-22: two of one copy's four went to Amsterdam, lost ~100 times
  # the packets of the Helsinki ones, and ~600 of 2,950 players got the others' cars seconds late), and one that
  # drops (every few hours) drops its players; with 16, each is about a sixteenth of them (at 8000 players 500 a
  # connection; the Helsinki ones carried ~740 each that day without trouble).  Restart only the copy that has a bad
  # one (docker restart nfsu2-web-cloudflared-N; docker compose restart restarts them all).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    scale: 4
    restart: unless-stopped
    network_mode: service:net
    command: ["tunnel", "--no-autoupdate", "run"]
    # in the game's share of the CPU with the server (web/deploy/nfsu2.slice): it pays for each message too
    cgroup_parent: ${NFSU2_SLICE:-nfsu2.slice}
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env, the tunnel's token}
      # four threads of Go each, 16 for the four copies: with one for each of the slice's cores, Go's scheduler
      # woke idle threads that found nothing to do for a fifth of a copy's CPU (nfsu2.xyz, 2026-10-30, a copy's
      # profile at 5,800 players: findRunnable 18 %, futex 8 %)
      GOMAXPROCS: "4"
    logging: { driver: local }
  server:
    network_mode: service:net
    environment:
      NFSU2_REAL_IP_HEADER: cf-connecting-ip
      # HTTP on a Unix socket too, a name in the namespace (no file): a tunnel's service unix:@nfsu2-http
      NFSU2_HTTP_SOCKET: "@nfsu2-http"
