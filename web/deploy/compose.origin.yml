# compose.yml with Cloudflare's proxy (orange cloud) straight to the server: no Caddy, no tunnel.
# The server does TLS itself, with a Cloudflare Origin CA
# certificate, on NFSU2_TLS_PORT of the VPS's own network (an Origin Rule in Cloudflare sends https://NFSU2_HOST
# there); it believes CF-Connecting-IP only from Cloudflare's addresses, and those must show Cloudflare's origin-pull
# certificate or their handshakes fail.  So turn Authenticated Origin Pulls on (SSL/TLS, Origin Server) BEFORE
# starting this: until then every page gets Cloudflare's "SSL handshake failed" (525).  The VPS's firewall lets only
# Cloudflare's addresses reach NFSU2_TLS_PORT.  The server's plain port stays on 127.0.0.1, where the image's health
# check asks.  Without cloudflared, the CPU the tunnel took (about 3/4 of the slice at 4,300 players) is free.
#
# In .env, besides NFSU2_HOST, NFSU2_DATA and NFSU2_MODULE (compose.yml):
#   NFSU2_TLS_DIR=/srv/nfsu2/tls     origin.pem and origin.key: the Origin CA certificate and its key, readable by
#                                    the container's user (uid 1000) only: chown -R 1000:1000, chmod 700 the folder,
#                                    600 the key
#   NFSU2_TLS_PORT=28443             the port the Origin Rule names (default 28443)
#   COMPOSE_FILE=compose.yml:compose.origin.yml     so that plain "docker compose ..." uses both files
# then:  docker compose up -d --remove-orphans && docker compose logs -f server
# (--remove-orphans: from the tunnel, it stops and removes cloudflared and net.)
services:
  caddy:
    profiles: [off]          # not started: the server does TLS itself
  server:
    command:
      - --port
      - ${NFSU2_TLS_PORT:-28443}
      - --tls-cert
      - /tls/origin.pem
      - --tls-key
      - /tls/origin.key
      - --trusted-proxies
      - cloudflare
    environment:
      NFSU2_REAL_IP_HEADER: cf-connecting-ip
    volumes:
      - ${NFSU2_TLS_DIR:-./tls}:/tls:ro
