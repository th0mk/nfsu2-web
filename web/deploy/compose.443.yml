# compose.yml for a VPS where port 80 belongs to something else (another site or API): Caddy on 443 only
# (docs/web/VPS.md, "Port 80 taken").  It gets its Let's Encrypt certificate with the TLS challenge, on 443, and
# has no http -> https redirect: http://<your name> reaches whatever has port 80, so share the https:// link
# (Chrome tries https first anyway, and after the first visit HSTS keeps it there).  Not for Cloudflare's proxy,
# which lets no certificate challenge through to 443: with Cloudflare, the tunnel (compose.tunnel.yml) needs no
# port at all.
#
# In .env, besides NFSU2_HOST (compose.yml):
#   COMPOSE_FILE=compose.yml:compose.443.yml     so that plain "docker compose ..." uses both files
# then:  docker compose up -d && docker compose logs -f server
services:
  caddy:
    configs: !override [{ source: caddyfile-443, target: /etc/caddy/Caddyfile }]
configs:
  # compose.yml's Caddyfile without what it has on port 80 (the redirect, the HTTP challenge, the catch-all) and
  # without its Cloudflare part
  caddyfile-443:
    content: |
      {
      	admin off
      	auto_https disable_redirects
      	cert_issuer acme {
      		disable_http_challenge
      	}
      }
      :443 {
      	abort
      }
      ${NFSU2_HOST:-} {
      	reverse_proxy 127.0.0.1:${NFSU2_HTTP_PORT:-8080} {
      		transport http {
      			max_conns_per_host 63900
      		}
      	}
      	header -Server
      	header -Via
      	handle_errors {
      		header -Server
      	}
      }
