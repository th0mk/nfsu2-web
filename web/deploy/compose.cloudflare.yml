# compose.yml with Cloudflare's proxy (orange cloud) in front of Caddy (docs/web/VPS.md, "Cloudflare"): Caddy
# believes CF-Connecting-IP, the player's address, only from Cloudflare's proxy, and the server reads it.
#
# Cloudflare's addresses are not its proxy alone: any Cloudflare customer can connect from them (a Worker's TCP
# socket) and send any CF-Connecting-IP, and so pass as many players and lock real ones out of the server's
# per-address limits.  So Caddy also asks every connection for Cloudflare's origin-pull certificate, which only its
# proxy has (Authenticated Origin Pulls; the second security audit, 2026-10-22): without one, or from another
# address, the TLS handshake fails, and only Cloudflare's proxy reaches the game at all.  In Cloudflare's
# dashboard turn Authenticated Origin Pulls on (SSL/TLS, Origin Server) BEFORE starting this: until then
# Cloudflare shows no certificate and every page gets its "SSL handshake failed" error (525).
#
# In .env, besides NFSU2_HOST, NFSU2_DATA and NFSU2_MODULE (compose.yml):
#   COMPOSE_FILE=compose.yml:compose.cloudflare.yml     so that plain "docker compose ..." uses both files
# then:  docker compose up -d && docker compose logs -f server
services:
  caddy:
    configs: !override
      - { source: caddyfile-cloudflare, target: /etc/caddy/Caddyfile }
      - { source: cloudflare-origin-pull-ca, target: /etc/caddy/cloudflare-origin-pull-ca.pem }
  server:
    environment:
      NFSU2_REAL_IP_HEADER: cf-connecting-ip
configs:
  # compose.yml's Caddyfile with Cloudflare's addresses as the proxies whose CF-Connecting-IP is believed
  # (web/server-rs/crates/headers/cloudflare-ips.txt, as of 2026-10-18), and the origin-pull certificate asked of
  # every connection to the game's name
  caddyfile-cloudflare:
    content: |
      {
      	admin off
      	servers {
      		trusted_proxies static 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
      		client_ip_headers CF-Connecting-IP
      	}
      }
      http://${NFSU2_HOST:-} {
      	header -Server
      	redir https://{host}{uri} 308
      }
      :80 {
      	abort
      }
      :443 {
      	abort
      }
      ${NFSU2_HOST:-} {
      	tls {
      		client_auth {
      			mode require_and_verify
      			trust_pool file /etc/caddy/cloudflare-origin-pull-ca.pem
      		}
      	}
      	reverse_proxy 127.0.0.1:${NFSU2_HTTP_PORT:-8080} {
      		header_up CF-Connecting-IP {client_ip}
      		transport http {
      			max_conns_per_host 95900
      		}
      	}
      	header -Server
      	header -Via
      	handle_errors {
      		header -Server
      	}
      }
  # web/server-rs/crates/headers/cloudflare-origin-pull-ca.pem: Cloudflare's origin-pull CA, from
  # https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem as of 2026-10-22 (valid until
  # 2029-11-01, SHA-256 fingerprint 9A:1A:C2:B4:BE:15:F9:F2:7E:EE:20:A7:34:CB:A4:E9:89:8F:61:00:1B:3B:D7:C8:4B:69:B5:6A:3E:25:A2:B9)
