# NFS Underground 2 in the browser on a VPS, with Docker (docs/web/VPS.md): the server's image (Dockerfile)
# and Caddy, which does HTTPS with a Let's Encrypt certificate it gets and renews by itself.  Both use the VPS's
# own network, as Caddy and the server do without Docker: Caddy on ports 80 and 443, forwarding to the server on
# 127.0.0.1:8080, which nothing outside the VPS can reach.  So Caddy sees every player's real address, over IPv6
# too, and the VPS's firewall (ufw, nftables) decides who can play.  (Ports published from a Docker network
# would pass by that firewall, and would give every IPv6 player the same address, which the server's
# per-address limits then count as one.)
#
# In .env next to this file (or the environment):
#   NFSU2_HOST=game.example.com      the name players open (one name); its DNS record points at this VPS
#   NFSU2_DATA=/srv/nfsu2/game       your NFS Underground 2 folder (default ./game), readable by everyone
#   NFSU2_MODULE=/srv/nfsu2/module   nfsu2.wasm and nfsu2.json from web/build.sh (default ./module)
#   NFSU2_IMAGE=<image>              the server's image (default ghcr.io/th0mk/nfsu2-web-rs:latest)
#   NFSU2_HTTP_PORT=8080             the server's port on 127.0.0.1, if 8080 is taken on the VPS
#   NFSU2_THREADS=12                 the Rust image's worker threads (default half the cores, 2 to 8); with
#                                    more than about 3000 players in free roam, 8 workers keep them at fewer
#                                    friends each (web/server-rs/README.md, "Measured")
#   NFSU2_SLICE=nfsu2.slice          the systemd slice every container here runs in (nfsu2.slice: its CPUQuota
#                                    keeps the rest of the VPS its share; docs/web/VPS.md, "A share of the VPS")
# then:  docker compose up -d && docker compose logs -f server
# Port 80 taken by something else on the VPS: compose.443.yml.  A Cloudflare Tunnel instead of Caddy:
# compose.tunnel.yml.  Cloudflare's proxy (orange cloud) in front of Caddy: compose.cloudflare.yml.  Cloudflare's
# proxy straight to the server (no Caddy, no tunnel): compose.origin.yml.
name: nfsu2-web
services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    network_mode: host
    configs: [{ source: caddyfile, target: /etc/caddy/Caddyfile }]
    volumes: [caddy-data:/data, caddy-config:/config]
    cgroup_parent: ${NFSU2_SLICE:-nfsu2.slice}
    logging: { driver: local }
  server:
    image: ${NFSU2_IMAGE:-ghcr.io/th0mk/nfsu2-web-rs:latest}
    restart: unless-stopped
    network_mode: host
    command: ["--behind-proxy"]
    environment:
      NFSU2_HOST: ${NFSU2_HOST:?set NFSU2_HOST in .env, the name players open (game.example.com)}
      NFSU2_HTTP_PORT: ${NFSU2_HTTP_PORT:-8080}
      NFSU2_REAL_IP_HEADER: ${NFSU2_REAL_IP_HEADER:-x-forwarded-for}
      NFSU2_THREADS: ${NFSU2_THREADS:-}
      # the room for keyphrase saves, in GB (docs/web/VPS.md, "Keyphrase saves"; 50 when not set, 0: none)
      NFSU2_VAULT_GB: ${NFSU2_VAULT_GB:-}
      # Cloudflare Turnstile's keys for claiming a name (docs/web/VPS.md, "Claimed names"; none: no check)
      NFSU2_TURNSTILE_SITE: ${NFSU2_TURNSTILE_SITE:-}
      NFSU2_TURNSTILE_SECRET: ${NFSU2_TURNSTILE_SECRET:-}
    volumes:
      - ${NFSU2_DATA:-./game}:/game:ro
      - ${NFSU2_MODULE:-./module}:/module:ro
      - state:/state
    # what the systemd unit (nfsu2-web.service) allows the server, as far as a container goes: nothing to write
    # but its state, no capabilities, no swap, 65536 open files (the Rust image's 6000 players take up to 48000
    # connections, 8 each); 8 GB of memory, not the unit's 3 GB (the live Node server reached 2.6 GB with 110 players)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 8g
    memswap_limit: 8g
    ulimits: { nofile: 65536 }
    # the game's share of the VPS's CPU, with Caddy's (or cloudflared's): web/deploy/nfsu2.slice
    cgroup_parent: ${NFSU2_SLICE:-nfsu2.slice}
    # the VPS's cgroup tree (read only), not one of its own, so that the server sees what the whole slice uses: over
    # 85 % of its quota free roam gives players fewer friends (the console's "CPU quota" line at the start says the
    # quota it found, the [players] lines what the slice used)
    cgroup: host
    # the console, kept by Docker in files it rotates (5 of 20 MB), so the log never fills the VPS's disk
    logging: { driver: local }
configs:
  caddyfile:
    # web/deploy/Caddyfile for NFSU2_HOST.  Caddy names no software (no Server or Via header, also not on its
    # redirects and errors), closes a connection for any other name (the bare address, a scanner's made-up name)
    # without an answer, and opens at most 47900 connections to the server (the Rust image takes 48000 with 6000
    # players).  It believes no proxy in front: the client's address is the one that connected, and a
    # CF-Connecting-IP a client sends is replaced by it (behind Cloudflare's proxy: compose.cloudflare.yml).  The
    # admin API (127.0.0.1:2019) stays off: nothing reconfigures Caddy while it runs.
    content: |
      {
      	admin off
      }
      http://${NFSU2_HOST:-} {
      	header -Server
      	redir https://{host}{uri} 308
      }
      :80 {
      	abort
      }
      :443 {
      	abort
      }
      ${NFSU2_HOST:-} {
      	reverse_proxy 127.0.0.1:${NFSU2_HTTP_PORT:-8080} {
      		header_up CF-Connecting-IP {client_ip}
      		transport http {
      			max_conns_per_host 47900
      		}
      	}
      	header -Server
      	header -Via
      	handle_errors {
      		header -Server
      	}
      }
volumes:
  state:
  caddy-data:
  caddy-config:
