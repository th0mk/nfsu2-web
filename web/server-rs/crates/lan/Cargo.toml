[package]
name = "nfsu2-lan"
description = "The virtual LAN switch between the browsers (10.77.0.0/18), on every core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nfsu2-util.workspace = true
nfsu2-names.workspace = true
nfsu2-ws.workspace = true
tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec.workspace = true
crc32fast.workspace = true
unicode-normalization.workspace = true
unicode-general-category.workspace = true
# the maps and sets the switch keeps (peers, reservations, the peer list's changes) are in insertion order, and the
# peer lists, the store and the reservations' eviction show it
indexmap = "2"

[dev-dependencies]
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
tempfile.workspace = true
# the load test opens a few thousand sockets: it raises its own limit on open files
libc = "0.2"
