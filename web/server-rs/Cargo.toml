# The server, in Rust (README.md): the binary (src/) and its crates (crates/).  It replaced the Node server.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.85"

[workspace.dependencies]
nfsu2-util = { path = "crates/util" }
nfsu2-names = { path = "crates/names" }
nfsu2-headers = { path = "crates/headers" }
nfsu2-http = { path = "crates/http" }
nfsu2-ws = { path = "crates/ws" }
nfsu2-lan = { path = "crates/lan" }
nfsu2-roam = { path = "crates/roam" }
nfsu2-online = { path = "crates/online" }
nfsu2-vault = { path = "crates/vault" }
nfsu2-bans = { path = "crates/bans" }
nfsu2-claims = { path = "crates/claims" }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
bytes = "1"
parking_lot = "0.12"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
md-5 = "0.10"
base64 = "0.22"
getrandom = "0.3"
rand = "0.9"
libc = "0.2"
httparse = "1"
memchr = "2"
itoa = "1"
smallvec = "1"
crossbeam-utils = "0.8"
socket2 = { version = "0.6", features = ["all"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "1"
x509-parser = "0.18"
zstd = "0.13"
brotli = "8"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1"
unicode-normalization = "0.1"
unicode-general-category = "1"
regex = "1"
futures-util = "0.3"
mimalloc = { version = "0.1", default-features = false }
tempfile = "3"
tokio-tungstenite = "0.27"

[package]
name = "nfsu2-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nfsu2-server"
path = "src/main.rs"

[dependencies]
nfsu2-util.workspace = true
nfsu2-names.workspace = true
nfsu2-headers.workspace = true
nfsu2-http.workspace = true
nfsu2-ws.workspace = true
nfsu2-lan.workspace = true
nfsu2-roam.workspace = true
nfsu2-online.workspace = true
nfsu2-vault.workspace = true
nfsu2-bans.workspace = true
nfsu2-claims.workspace = true
tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
libc.workspace = true
zstd.workspace = true
brotli.workspace = true
flate2.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
webpki-roots.workspace = true
x509-parser.workspace = true
mimalloc.workspace = true
unicode-normalization.workspace = true
futures-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
# the integration tests in tests/: fake browsers on the switch's WebSocket
tokio-tungstenite.workspace = true
futures-util.workspace = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
# a bug in one connection's task must not take the server down: the task unwinds, the others go on
panic = "unwind"

[profile.dev]
opt-level = 1
